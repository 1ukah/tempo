[package]
name = "tempo"
version = "0.1.0"
edition = "2024"
description = "Steam hour farming from the command line"
license = "MIT"
readme = "README.md"
keywords = ["steam", "idle", "hours", "achievements", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "tempo-cli"
path = "src/main.rs"

[dependencies]
reqwest = "0.13"
rpassword = "7"
serde_json = "1"
steam-vent = "0.5"
steam-vent-proto-common = "0.5"
steam-vent-proto-steam = "0.5"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time", "signal", "sync"] }
tokio-stream = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
