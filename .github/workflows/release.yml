name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$version"
          grep -qx "version = \"$version\"" Cargo.toml
          grep -q "^## \[$version\]" CHANGELOG.md

  build:
    needs: check
    strategy:
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$GITHUB_WORKSPACE/scripts/install.cmd" .
            7z a "$GITHUB_WORKSPACE/tempo-cli-${{ matrix.target }}.zip" tempo-cli.exe install.cmd
          else
            cp "$GITHUB_WORKSPACE/scripts/install.sh" .
            chmod +x install.sh
            tar czf "$GITHUB_WORKSPACE/tempo-cli-${{ matrix.target }}.tar.gz" tempo-cli install.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: tempo-cli-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ { found = 0 }
            found
          ' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "tempo $GITHUB_REF_NAME" --notes-file notes.md
